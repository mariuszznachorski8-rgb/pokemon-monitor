name: Test powiadomienia Telegram

on:
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wyslij wiadomosc testowa
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: python
        run: |
          import json
          import os
          import urllib.request

          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          if not token or not chat_id:
              raise SystemExit('Dodaj sekrety TELEGRAM_BOT_TOKEN i TELEGRAM_CHAT_ID w ustawieniach repozytorium.')
          if not chat_id.isdecimal() or int(chat_id) <= 0:
              raise SystemExit('TELEGRAM_CHAT_ID musi byc dodatnim identyfikatorem prywatnej rozmowy.')
          payload = json.dumps({
              'chat_id': chat_id,
              'text': 'Test Pokemon Monitor: powiadomienia dzialaja. Monitoring Empiku i Media Expert nie jest jeszcze uruchomiony.'
          }).encode('utf-8')
          req = urllib.request.Request(
              'https://api.telegram.org/bot' + token + '/sendMessage',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST'
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  result = json.load(response)
              if not result.get('ok'):
                  raise ValueError('Telegram rejected request')
          except Exception:
              raise SystemExit('Wysylka nie powiodla sie. Sprawdz token, ID rozmowy i czy wyslales /start do bota.') from None
          print('Wiadomosc testowa wyslana.')
